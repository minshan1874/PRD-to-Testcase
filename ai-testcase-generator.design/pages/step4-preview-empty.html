:root {
  /* ===== 主色系（靛蓝） ===== */
  --primary-50:  oklch(0.978 0.018 278);
  --primary-100: oklch(0.946 0.034 278);
  --primary-200: oklch(0.898 0.064 278);
  --primary-300: oklch(0.826 0.112 278);
  --primary-400: oklch(0.728 0.168 276);
  --primary-500: oklch(0.623 0.214 274);  /* 主色 */
  --primary-600: oklch(0.546 0.245 272);
  --primary-700: oklch(0.478 0.258 270);
  --primary-800: oklch(0.416 0.238 268);
  --primary-900: oklch(0.356 0.188 266);

  /* ===== 中性色阶 ===== */
  --gray-50:  oklch(0.985 0.002 262);
  --gray-100: oklch(0.962 0.004 262);
  --gray-200: oklch(0.922 0.007 262);
  --gray-300: oklch(0.872 0.010 262);
  --gray-400: oklch(0.708 0.014 262);
  --gray-500: oklch(0.556 0.016 262);
  --gray-600: oklch(0.439 0.018 262);
  --gray-700: oklch(0.349 0.018 262);
  --gray-800: oklch(0.248 0.016 262);
  --gray-900: oklch(0.145 0.012 262);

  /* ===== 语义状态色 ===== */
  --success-50:  oklch(0.970 0.032 158);
  --success-100: oklch(0.936 0.064 158);
  --success-500: oklch(0.648 0.222 158);  /* 成功 */
  --success-600: oklch(0.577 0.200 158);
  --success-700: oklch(0.508 0.164 158);

  --warning-50:  oklch(0.976 0.042 90);
  --warning-100: oklch(0.948 0.078 90);
  --warning-500: oklch(0.755 0.182 82);   /* 警告 */
  --warning-600: oklch(0.682 0.198 70);
  --warning-700: oklch(0.564 0.202 58);

  --error-50:  oklch(0.968 0.036 24);
  --error-100: oklch(0.930 0.072 24);
  --error-500: oklch(0.637 0.228 27);     /* 错误 */
  --error-600: oklch(0.577 0.245 27);
  --error-700: oklch(0.508 0.232 26);

  --info-50:  oklch(0.966 0.026 242);
  --info-100: oklch(0.928 0.052 242);
  --info-500: oklch(0.588 0.198 250);     /* 信息 */
  --info-600: oklch(0.514 0.202 252);

  /* ===== 品牌前缀变量 ===== */
  --tcg-background: var(--gray-50);
  --tcg-foreground: var(--gray-900);
  --tcg-card: #ffffff;
  --tcg-card-foreground: var(--gray-900);
  --tcg-popover: #ffffff;
  --tcg-popover-foreground: var(--gray-900);
  --tcg-primary: var(--primary-600);
  --tcg-primary-foreground: #ffffff;
  --tcg-muted: var(--gray-100);
  --tcg-muted-foreground: var(--gray-500);
  --tcg-accent: var(--primary-50);
  --tcg-accent-foreground: var(--primary-700);
  --tcg-destructive: var(--error-600);
  --tcg-destructive-foreground: #ffffff;
  --tcg-border: var(--gray-200);
  --tcg-input: var(--gray-200);
  --tcg-ring: var(--primary-500);
  --tcg-radius-sm: var(--radius-sm);
  --tcg-radius-md: var(--radius-md);
  --tcg-radius-lg: var(--radius-lg);
  --tcg-radius-xl: var(--radius-xl);

  /* ===== 语义别名 ===== */
  --background: var(--gray-50);
  --foreground: var(--gray-900);
  --card: #ffffff;
  --card-foreground: var(--gray-900);
  --popover: #ffffff;
  --popover-foreground: var(--gray-900);
  --primary: var(--primary-600);
  --primary-foreground: #ffffff;
  --muted: var(--gray-100);
  --muted-foreground: var(--gray-500);
  --accent: var(--primary-50);
  --accent-foreground: var(--primary-700);
  --destructive: var(--error-600);
  --destructive-foreground: #ffffff;
  --border: var(--gray-200);
  --input: var(--gray-200);
  --ring: var(--primary-500);

  /* ===== 状态色语义 ===== */
  --state-success: var(--success-500);
  --state-success-bg: var(--success-50);
  --state-success-border: var(--success-100);
  --state-warning: var(--warning-600);
  --state-warning-bg: var(--warning-50);
  --state-warning-border: var(--warning-100);
  --state-error: var(--error-600);
  --state-error-bg: var(--error-50);
  --state-error-border: var(--error-100);
  --state-info: var(--info-500);
  --state-info-bg: var(--info-50);
  --state-info-border: var(--info-100);

  /* ===== 圆角 ===== */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;

  /* ===== 阴影 ===== */
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.04);
  --shadow-md: 0 2px 8px -2px rgb(0 0 0 / 0.06), 0 1px 4px -2px rgb(0 0 0 / 0.04);
  --shadow-lg: 0 12px 24px -8px rgb(0 0 0 / 0.08), 0 4px 12px -4px rgb(0 0 0 / 0.05);
  --shadow-xl: 0 20px 40px -12px rgb(0 0 0 / 0.10);

  /* ===== 字体 ===== */
  --font-sans: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;

  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* ===== 间距 ===== */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);

  --color-primary-foreground: var(--primary-foreground);

  --color-muted-foreground: var(--muted-foreground);

  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-success: var(--state-success);
  --color-warning: var(--state-warning);
  --color-error: var(--state-error);
  --color-info: var(--state-info);
  --radius-sm: var(--radius-sm);

  --radius-lg: var(--radius-lg);
  --radius-xl: var(--radius-xl);

}

/* ===== 基础样式 ===== */
* {
  box-sizing: border-box;
  border-color: var(--border);
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== 工具类 ===== */
.text-muted { color: var(--muted-foreground); }
.text-success { color: var(--state-success); }
.text-warning { color: var(--state-warning); }
.text-error { color: var(--state-error); }

.bg-success { background: var(--state-success-bg); }
.bg-warning { background: var(--state-warning-bg); }
.bg-error { background: var(--state-error-bg); }
.bg-info { background: var(--state-info-bg); }

.border-success { border-color: var(--state-success-border); }
.border-warning { border-color: var(--state-warning-border); }
.border-error { border-color: var(--state-error-border); }

    <style>
      /* ===== Page Layout ===== */
      .page-container {
        max-width: 1152px;
        margin: 0 auto;
        padding: 24px 24px 48px;
      }

      /* ===== Header ===== */
      .app-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 0 24px;
      }
      .app-header .logo-icon {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--primary-600);
        color: #fff;
        border-radius: var(--radius-md);
      }
      .app-header .app-title {
        font-size: var(--text-lg);
        font-weight: 600;
        color: var(--gray-900);
        letter-spacing: -0.01em;
      }

      /* ===== Step Navigation ===== */
      .step-nav {
        display: flex;
        align-items: center;
        background: #fff;
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-lg);
        padding: 12px 16px;
        margin-bottom: 20px;
        box-shadow: var(--shadow-sm);
      }
      .step-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: var(--radius-md);
        font-size: var(--text-sm);
        color: var(--gray-500);
        flex-shrink: 0;
      }
      .step-item .step-num {
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-full);
        background: var(--gray-100);
        color: var(--gray-500);
        font-size: var(--text-xs);
        font-weight: 600;
      }
      .step-item.completed {
        color: var(--gray-700);
      }
      .step-item.completed .step-num {
        background: var(--primary-100);
        color: var(--primary-700);
      }
      .step-item.active {
        background: var(--primary-600);
        color: #fff;
      }
      .step-item.active .step-num {
        background: rgba(255,255,255,0.2);
        color: #fff;
      }
      .step-divider {
        flex: 1;
        height: 1px;
        background: var(--gray-200);
        margin: 0 4px;
        min-width: 24px;
      }

      /* ===== Card ===== */
      .preview-card {
        background: #fff;
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      /* ===== Card Toolbar ===== */
      .card-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--gray-200);
      }
      .toolbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .toolbar-title {
        font-size: var(--text-lg);
        font-weight: 600;
        color: var(--gray-900);
      }
      .count-badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 10px;
        border-radius: var(--radius-full);
        background: var(--gray-100);
        color: var(--gray-500);
        font-size: var(--text-xs);
        font-weight: 500;
        border: 1px solid var(--gray-200);
      }
      .toolbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border-radius: var(--radius-md);
        font-size: var(--text-sm);
        font-weight: 500;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--primary-600);
        color: #fff;
        border-color: var(--primary-600);
      }
      .btn-primary:hover {
        background: var(--primary-700);
        border-color: var(--primary-700);
      }
      .btn-outline {
        background: #fff;
        color: var(--gray-700);
        border-color: var(--gray-300);
      }
      .btn-outline:hover {
        background: var(--gray-50);
        border-color: var(--gray-400);
      }
      .btn:disabled,
      .btn[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
        background: var(--gray-100);
        border-color: var(--gray-200);
        color: var(--gray-400);
      }
      .btn svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      /* ===== Empty State ===== */
      .empty-state {
        min-height: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      }
      .empty-icon {
        width: 64px;
        height: 64px;
        color: var(--gray-300);
        opacity: 0.6;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .empty-icon svg {
        width: 64px;
        height: 64px;
        stroke-width: 1.5;
      }
      .empty-title {
        margin-top: 16px;
        font-size: var(--text-lg);
        font-weight: 500;
        color: var(--gray-900);
        text-align: center;
      }
      .empty-description {
        margin-top: 8px;
        font-size: var(--text-sm);
        color: var(--gray-500);
        text-align: center;
        max-width: 384px;
        line-height: 1.6;
      }
      .empty-action {
        margin-top: 24px;
      }
      .btn-return {
        height: 36px;
        padding: 0 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--primary-600);
        color: #fff;
        border: 1px solid var(--primary-600);
        border-radius: var(--radius-md);
        font-size: var(--text-sm);
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn-return:hover {
        background: var(--primary-700);
        border-color: var(--primary-700);
      }
      .btn-return svg {
        width: 16px;
        height: 16px;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <div class="page-container">
        <!-- Header -->
        <header class="app-header">
          <span class="logo-icon">
            <i data-lucide="clipboard-list" style="width:18px;height:18px;"></i>
          </span>
          <span class="app-title">AI生成测试用例</span>
        </header>

        <!-- Step Navigation -->
        <nav class="step-nav">
          <div class="step-item completed" data-dom-id="step-nav-1">
            <span class="step-num">
              <i data-lucide="check" style="width:12px;height:12px;"></i>
            </span>
            <span>上传文档</span>
          </div>
          <div class="step-divider"></div>
          <div class="step-item completed" data-dom-id="step-nav-2">
            <span class="step-num">
              <i data-lucide="check" style="width:12px;height:12px;"></i>
            </span>
            <span>生成配置</span>
          </div>
          <div class="step-divider"></div>
          <div class="step-item completed" data-dom-id="step-nav-3">
            <span class="step-num">
              <i data-lucide="check" style="width:12px;height:12px;"></i>
            </span>
            <span>生成结果</span>
          </div>
          <div class="step-divider"></div>
          <div class="step-item active" data-dom-id="step-nav-4">
            <span class="step-num">4</span>
            <span>预览导出</span>
          </div>
        </nav>

        <!-- Main Content Card -->
        <div class="preview-card">
          <!-- Card Toolbar -->
          <div class="card-toolbar">
            <div class="toolbar-left">
              <span class="toolbar-title">④ Excel 预览</span>
              <span class="count-badge">0 条用例</span>
            </div>
            <div class="toolbar-right">
              <button class="btn btn-outline" data-dom-id="btn-export-selected" disabled>
                <i data-lucide="download" style="width:16px;height:16px;"></i>
                导出勾选（0）
              </button>
              <button class="btn btn-primary" data-dom-id="btn-export-all" disabled>
                <i data-lucide="download" style="width:16px;height:16px;"></i>
                导出全部
              </button>
            </div>
          </div>

          <!-- Empty State Area -->
          <div class="empty-state">
            <div class="empty-icon">
              <i data-lucide="file-question" style="width:64px;height:64px;"></i>
            </div>
            <div class="empty-title">尚未生成结果</div>
            <div class="empty-description">
              请先回到生成结果步骤，生成测试用例后再进行预览与导出。
            </div>
            <div class="empty-action">
              <button class="btn-return" data-dom-id="btn-back-step4">
                <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
                返回生成结果
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
