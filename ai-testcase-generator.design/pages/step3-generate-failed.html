/* ============================================
   AI 测试用例生成器 · 设计系统 Tokens
   风格：专业工具型 / 靛蓝主色 / 数据密集友好
   ============================================ */

:root {
  /* ===== 主色系（靛蓝） ===== */
  --primary-50:  oklch(0.978 0.018 278);
  --primary-100: oklch(0.946 0.034 278);
  --primary-200: oklch(0.898 0.064 278);
  --primary-300: oklch(0.826 0.112 278);
  --primary-400: oklch(0.728 0.168 276);
  --primary-500: oklch(0.623 0.214 274);  /* 主色 */
  --primary-600: oklch(0.546 0.245 272);
  --primary-700: oklch(0.478 0.258 270);
  --primary-800: oklch(0.416 0.238 268);
  --primary-900: oklch(0.356 0.188 266);

  /* ===== 中性色阶 ===== */
  --gray-50:  oklch(0.985 0.002 262);
  --gray-100: oklch(0.962 0.004 262);
  --gray-200: oklch(0.922 0.007 262);
  --gray-300: oklch(0.872 0.010 262);
  --gray-400: oklch(0.708 0.014 262);
  --gray-500: oklch(0.556 0.016 262);
  --gray-600: oklch(0.439 0.018 262);
  --gray-700: oklch(0.349 0.018 262);
  --gray-800: oklch(0.248 0.016 262);
  --gray-900: oklch(0.145 0.012 262);

  /* ===== 语义状态色 ===== */
  --success-50:  oklch(0.970 0.032 158);
  --success-100: oklch(0.936 0.064 158);
  --success-500: oklch(0.648 0.222 158);  /* 成功 */
  --success-600: oklch(0.577 0.200 158);
  --success-700: oklch(0.508 0.164 158);

  --warning-50:  oklch(0.976 0.042 90);
  --warning-100: oklch(0.948 0.078 90);
  --warning-500: oklch(0.755 0.182 82);   /* 警告 */
  --warning-600: oklch(0.682 0.198 70);
  --warning-700: oklch(0.564 0.202 58);

  --error-50:  oklch(0.968 0.036 24);
  --error-100: oklch(0.930 0.072 24);
  --error-500: oklch(0.637 0.228 27);     /* 错误 */
  --error-600: oklch(0.577 0.245 27);
  --error-700: oklch(0.508 0.232 26);

  --info-50:  oklch(0.966 0.026 242);
  --info-100: oklch(0.928 0.052 242);
  --info-500: oklch(0.588 0.198 250);     /* 信息 */
  --info-600: oklch(0.514 0.202 252);

  /* ===== 品牌前缀变量 ===== */
  --tcg-background: var(--gray-50);
  --tcg-foreground: var(--gray-900);
  --tcg-card: #ffffff;
  --tcg-card-foreground: var(--gray-900);
  --tcg-popover: #ffffff;
  --tcg-popover-foreground: var(--gray-900);
  --tcg-primary: var(--primary-600);
  --tcg-primary-foreground: #ffffff;
  --tcg-muted: var(--gray-100);
  --tcg-muted-foreground: var(--gray-500);
  --tcg-accent: var(--primary-50);
  --tcg-accent-foreground: var(--primary-700);
  --tcg-destructive: var(--error-600);
  --tcg-destructive-foreground: #ffffff;
  --tcg-border: var(--gray-200);
  --tcg-input: var(--gray-200);
  --tcg-ring: var(--primary-500);
  --tcg-radius-sm: var(--radius-sm);
  --tcg-radius-md: var(--radius-md);
  --tcg-radius-lg: var(--radius-lg);
  --tcg-radius-xl: var(--radius-xl);

  /* ===== 语义别名 ===== */
  --background: var(--gray-50);
  --foreground: var(--gray-900);
  --card: #ffffff;
  --card-foreground: var(--gray-900);
  --popover: #ffffff;
  --popover-foreground: var(--gray-900);
  --primary: var(--primary-600);
  --primary-foreground: #ffffff;
  --muted: var(--gray-100);
  --muted-foreground: var(--gray-500);
  --accent: var(--primary-50);
  --accent-foreground: var(--primary-700);
  --destructive: var(--error-600);
  --destructive-foreground: #ffffff;
  --border: var(--gray-200);
  --input: var(--gray-200);
  --ring: var(--primary-500);

  /* ===== 状态色语义 ===== */
  --state-success: var(--success-500);
  --state-success-bg: var(--success-50);
  --state-success-border: var(--success-100);
  --state-warning: var(--warning-600);
  --state-warning-bg: var(--warning-50);
  --state-warning-border: var(--warning-100);
  --state-error: var(--error-600);
  --state-error-bg: var(--error-50);
  --state-error-border: var(--error-100);
  --state-info: var(--info-500);
  --state-info-bg: var(--info-50);
  --state-info-border: var(--info-100);

  /* ===== 圆角 ===== */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;

  /* ===== 阴影 ===== */
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.04);
  --shadow-md: 0 2px 8px -2px rgb(0 0 0 / 0.06), 0 1px 4px -2px rgb(0 0 0 / 0.04);
  --shadow-lg: 0 12px 24px -8px rgb(0 0 0 / 0.08), 0 4px 12px -4px rgb(0 0 0 / 0.05);
  --shadow-xl: 0 20px 40px -12px rgb(0 0 0 / 0.10);

  /* ===== 字体 ===== */
  --font-sans: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;

  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* ===== 间距 ===== */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-success: var(--state-success);
  --color-warning: var(--state-warning);
  --color-error: var(--state-error);
  --color-info: var(--state-info);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --radius-xl: var(--radius-xl);
  --radius-full: var(--radius-full);
}

/* ===== 基础样式 ===== */
* {
  box-sizing: border-box;
  border-color: var(--border);
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== 工具类 ===== */
.text-muted { color: var(--muted-foreground); }
.text-success { color: var(--state-success); }
.text-warning { color: var(--state-warning); }
.text-error { color: var(--state-error); }

.bg-success { background: var(--state-success-bg); }
.bg-warning { background: var(--state-warning-bg); }
.bg-error { background: var(--state-error-bg); }
.bg-info { background: var(--state-info-bg); }

.border-success { border-color: var(--state-success-border); }
.border-warning { border-color: var(--state-warning-border); }
.border-error { border-color: var(--state-error-border); }

    <style>
      /* ===== Step Nav ===== */
      .step-nav-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .step-nav-item.completed {
        color: var(--primary);
        background: var(--primary-50);
      }
      .step-nav-item.completed:hover {
        background: var(--primary-100);
      }
      .step-nav-item.active {
        color: #ffffff;
        background: var(--primary);
        font-weight: 500;
      }
      .step-nav-item.locked {
        color: var(--gray-400);
        background: var(--gray-100);
        cursor: not-allowed;
      }
      .step-nav-num {
        width: 20px;
        height: 20px;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
      }
      .step-nav-item.completed .step-nav-num {
        background: var(--primary);
        color: #ffffff;
      }
      .step-nav-item.active .step-nav-num {
        background: rgba(255,255,255,0.2);
        color: #ffffff;
      }
      .step-nav-item.locked .step-nav-num {
        background: var(--gray-200);
        color: var(--gray-400);
      }

      /* ===== Summary Badge ===== */
      .summary-badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--gray-200);
        background: transparent;
        color: var(--gray-700);
        border-radius: 9999px;
        padding: 4px 12px;
        font-size: 11px;
        line-height: 1;
      }

      /* ===== Phase Stepper ===== */
      .phase-circle {
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        position: relative;
      }
      .phase-circle.completed {
        background-color: var(--primary);
        color: #ffffff;
      }
      .phase-circle.failed {
        background-color: var(--error-500);
        color: #ffffff;
      }
      .phase-circle.pending {
        background-color: #ffffff;
        border: 2px solid var(--gray-200);
        color: var(--gray-400);
      }
      .phase-line {
        height: 2px;
        flex: 1;
        min-width: 40px;
      }
      .phase-line.completed {
        background-color: var(--primary);
      }
      .phase-line.pending {
        background-color: var(--gray-200);
      }
      .phase-label {
        font-size: 11px;
        margin-top: 8px;
        text-align: center;
        white-space: nowrap;
      }
      .phase-label.completed {
        color: var(--primary);
        font-weight: 500;
      }
      .phase-label.failed {
        color: var(--error-600);
        font-weight: 500;
      }
      .phase-label.pending {
        color: var(--gray-400);
      }

      /* ===== Error Details ===== */
      .error-details-trigger {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        color: var(--primary);
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        font-family: inherit;
      }
      .error-details-trigger:hover {
        color: var(--primary-700);
      }
      .error-details-trigger .chevron {
        transition: transform 0.2s ease;
      }
      .error-details-trigger[aria-expanded="true"] .chevron {
        transform: rotate(180deg);
      }
      .error-details-content {
        margin-top: 12px;
        background-color: var(--gray-50);
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-md);
        padding: 12px;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
        text-align: left;
      }
      .error-details-content pre {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.6;
        color: var(--gray-600);
        white-space: pre-wrap;
        word-break: break-all;
      }

      /* ===== Action Buttons ===== */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 0 16px;
        background-color: var(--primary);
        color: #ffffff;
        border: 1px solid var(--primary);
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      .btn-primary:hover {
        background-color: var(--primary-700);
      }
      .btn-primary svg {
        width: 16px;
        height: 16px;
        margin-right: 8px;
      }
      .btn-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 0 16px;
        background-color: #ffffff;
        color: var(--gray-700);
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      .btn-outline:hover {
        background-color: var(--gray-50);
      }
      .btn-outline svg {
        width: 16px;
        height: 16px;
        margin-right: 8px;
      }

            <i data-lucide="clipboard-list" style="width:18px;height:18px;"></i>
          </div>
          <h1 class="text-base font-semibold text-foreground">AI生成测试用例</h1>
        </div>
      </header>

      <!-- ===== Step Navigation ===== -->
      <div class="bg-card border-b border-border">
        <div class="max-w-[1152px] mx-auto px-6 py-4 flex items-center gap-2">
          <button class="step-nav-item completed" data-dom-id="step-nav-1">
            <span class="step-nav-num">
              <i data-lucide="check" style="width:12px;height:12px;"></i>
            </span>
            <span>上传文档</span>
          </button>
          <div class="text-gray-300 text-sm">&#8594;</div>
          <button class="step-nav-item completed" data-dom-id="step-nav-2">
            <span class="step-nav-num">
              <i data-lucide="check" style="width:12px;height:12px;"></i>
            </span>
            <span>生成配置</span>
          </button>
          <div class="text-gray-300 text-sm">&#8594;</div>
          <button class="step-nav-item active" data-dom-id="step-nav-3">
            <span class="step-nav-num">3</span>
            <span>生成结果</span>
          </button>
          <div class="text-gray-300 text-sm">&#8594;</div>
          <div class="step-nav-item locked" data-dom-id="step-nav-4">
            <span class="step-nav-num">4</span>
            <span>预览导出</span>
          </div>
        </div>
      </div>

      <!-- ===== Main Content ===== -->
      <div class="max-w-[1152px] mx-auto px-6 py-8">
        <div class="bg-card border border-border rounded-lg">
          <!-- Card Header / Summary Bar -->
          <div class="px-6 py-5 border-b border-border">
            <h2 class="text-lg font-semibold text-foreground mb-3">&#9314; 生成测试用例</h2>
            <div class="flex flex-wrap gap-2">
              <span class="summary-badge">
                <i data-lucide="bot" style="width:12px;height:12px;margin-right:6px;"></i>
                模型：openai/gpt-5.6-luna
              </span>
              <span class="summary-badge">
                <i data-lucide="file-text" style="width:12px;height:12px;margin-right:6px;"></i>
                2 个文档
              </span>
              <span class="summary-badge">
                <i data-lucide="type" style="width:12px;height:12px;margin-right:6px;"></i>
                28,640 字符
              </span>
              <span class="summary-badge">
                <i data-lucide="image" style="width:12px;height:12px;margin-right:6px;"></i>
                5 张图片
              </span>
            </div>
          </div>

          <!-- Error Content Area -->
          <div class="py-12 px-6 text-center">
            <!-- Error Icon -->
            <div class="flex justify-center">
              <div class="w-20 h-20 rounded-full bg-error-50 flex items-center justify-center">
                <i data-lucide="x-circle" style="width:56px;height:56px;color: var(--error-500);"></i>
              </div>
            </div>

            <!-- Error Title -->
            <h3 class="text-xl font-semibold text-error mt-4">生成失败</h3>

            <!-- Error Message -->
            <p class="text-sm text-muted-foreground mt-2 max-w-md mx-auto leading-relaxed">
              OpenRouter API 请求超时，请检查网络连接或稍后重试。
            </p>

            <!-- Error Details (expandable, shown expanded) -->
            <div class="mt-6">
              <button class="error-details-trigger" aria-expanded="true" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'); document.getElementById('error-details-panel').hidden = this.getAttribute('aria-expanded') !== 'true';">
                查看详细原因
                <i data-lucide="chevron-down" class="chevron" style="width:14px;height:14px;"></i>
              </button>
              <div id="error-details-panel" class="error-details-content">
                <pre>HTTP 504 Gateway Timeout
Request ID: req_abc123xyz
Model: openai/gpt-5.6-luna
Time: 2026-09-06 14:32:18

Upstream service timed out after 120s.</pre>
              </div>
            </div>

            <!-- Phase Indicator -->
            <div class="mt-8">
              <div class="max-w-lg mx-auto">
                <div class="flex items-start justify-center">
                  <!-- Phase 1 - Completed -->
                  <div class="flex flex-col items-center">
                    <div class="phase-circle completed">
                      <i data-lucide="check" style="width:18px;height:18px;"></i>
                    </div>
                    <span class="phase-label completed">准备输入</span>
                  </div>
                  <!-- Line 1 - Completed -->
                  <div class="phase-line completed" style="margin-top: 19px;"></div>
                  <!-- Phase 2 - Failed -->
                  <div class="flex flex-col items-center">
                    <div class="phase-circle failed">
                      <i data-lucide="x" style="width:18px;height:18px;"></i>
                    </div>
                    <span class="phase-label failed">请求模型</span>
                  </div>
                  <!-- Line 2 - Pending -->
                  <div class="phase-line pending" style="margin-top: 19px;"></div>
                  <!-- Phase 3 - Pending -->
                  <div class="flex flex-col items-center">
                    <div class="phase-circle pending">
                      <i data-lucide="sparkles" style="width:16px;height:16px;"></i>
                    </div>
                    <span class="phase-label pending">整理结果</span>
                  </div>
                  <!-- Line 3 - Pending -->
                  <div class="phase-line pending" style="margin-top: 19px;"></div>
                  <!-- Phase 4 - Pending -->
                  <div class="flex flex-col items-center">
                    <div class="phase-circle pending">
                      <i data-lucide="flag" style="width:16px;height:16px;"></i>
                    </div>
                    <span class="phase-label pending">完成</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-8 flex items-center justify-center gap-3">
              <button class="btn-primary" data-dom-id="btn-retry-step3">
                <i data-lucide="refresh-cw" style="width:16px;height:16px;margin-right:8px;"></i>
                重试
              </button>
              <button class="btn-outline">
                <i data-lucide="settings" style="width:16px;height:16px;margin-right:8px;"></i>
                返回配置
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
