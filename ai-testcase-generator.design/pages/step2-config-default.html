<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02 生成配置 / 默认状态</title>
    <style id="theme-vars">
/* ============================================
   AI 测试用例生成器 · 设计系统 Tokens
   风格：专业工具型 / 靛蓝主色 / 数据密集友好
   ============================================ */

:root {
  /* ===== 主色系（靛蓝） ===== */
  --primary-50:  oklch(0.978 0.018 278);
  --primary-100: oklch(0.946 0.034 278);
  --primary-200: oklch(0.898 0.064 278);
  --primary-300: oklch(0.826 0.112 278);
  --primary-400: oklch(0.728 0.168 276);
  --primary-500: oklch(0.623 0.214 274);  /* 主色 */
  --primary-600: oklch(0.546 0.245 272);
  --primary-700: oklch(0.478 0.258 270);
  --primary-800: oklch(0.416 0.238 268);
  --primary-900: oklch(0.356 0.188 266);

  /* ===== 中性色阶 ===== */
  --gray-50:  oklch(0.985 0.002 262);
  --gray-100: oklch(0.962 0.004 262);
  --gray-200: oklch(0.922 0.007 262);
  --gray-300: oklch(0.872 0.010 262);
  --gray-400: oklch(0.708 0.014 262);
  --gray-500: oklch(0.556 0.016 262);
  --gray-600: oklch(0.439 0.018 262);
  --gray-700: oklch(0.349 0.018 262);
  --gray-800: oklch(0.248 0.016 262);
  --gray-900: oklch(0.145 0.012 262);

  /* ===== 语义状态色 ===== */
  --success-50:  oklch(0.970 0.032 158);
  --success-100: oklch(0.936 0.064 158);
  --success-500: oklch(0.648 0.222 158);  /* 成功 */
  --success-600: oklch(0.577 0.200 158);
  --success-700: oklch(0.508 0.164 158);

  --warning-50:  oklch(0.976 0.042 90);
  --warning-100: oklch(0.948 0.078 90);
  --warning-500: oklch(0.755 0.182 82);   /* 警告 */
  --warning-600: oklch(0.682 0.198 70);
  --warning-700: oklch(0.564 0.202 58);

  --error-50:  oklch(0.968 0.036 24);
  --error-100: oklch(0.930 0.072 24);
  --error-500: oklch(0.637 0.228 27);     /* 错误 */
  --error-600: oklch(0.577 0.245 27);
  --error-700: oklch(0.508 0.232 26);

  --info-50:  oklch(0.966 0.026 242);
  --info-100: oklch(0.928 0.052 242);
  --info-500: oklch(0.588 0.198 250);     /* 信息 */
  --info-600: oklch(0.514 0.202 252);

  /* ===== 品牌前缀变量 ===== */
  --tcg-background: var(--gray-50);
  --tcg-foreground: var(--gray-900);
  --tcg-card: #ffffff;
  --tcg-card-foreground: var(--gray-900);
  --tcg-popover: #ffffff;
  --tcg-popover-foreground: var(--gray-900);
  --tcg-primary: var(--primary-600);
  --tcg-primary-foreground: #ffffff;
  --tcg-muted: var(--gray-100);
  --tcg-muted-foreground: var(--gray-500);
  --tcg-accent: var(--primary-50);
  --tcg-accent-foreground: var(--primary-700);
  --tcg-destructive: var(--error-600);
  --tcg-destructive-foreground: #ffffff;
  --tcg-border: var(--gray-200);
  --tcg-input: var(--gray-200);
  --tcg-ring: var(--primary-500);
  --tcg-radius-sm: var(--radius-sm);
  --tcg-radius-md: var(--radius-md);
  --tcg-radius-lg: var(--radius-lg);
  --tcg-radius-xl: var(--radius-xl);

  /* ===== 语义别名 ===== */
  --background: var(--gray-50);
  --foreground: var(--gray-900);
  --card: #ffffff;
  --card-foreground: var(--gray-900);
  --popover: #ffffff;
  --popover-foreground: var(--gray-900);
  --primary: var(--primary-600);
  --primary-foreground: #ffffff;
  --muted: var(--gray-100);
  --muted-foreground: var(--gray-500);
  --accent: var(--primary-50);
  --accent-foreground: var(--primary-700);
  --destructive: var(--error-600);
  --destructive-foreground: #ffffff;
  --border: var(--gray-200);
  --input: var(--gray-200);
  --ring: var(--primary-500);

  /* ===== 状态色语义 ===== */
  --state-success: var(--success-500);
  --state-success-bg: var(--success-50);
  --state-success-border: var(--success-100);
  --state-warning: var(--warning-600);
  --state-warning-bg: var(--warning-50);
  --state-warning-border: var(--warning-100);
  --state-error: var(--error-600);
  --state-error-bg: var(--error-50);
  --state-error-border: var(--error-100);
  --state-info: var(--info-500);
  --state-info-bg: var(--info-50);
  --state-info-border: var(--info-100);

  /* ===== 圆角 ===== */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;

  /* ===== 阴影 ===== */
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.04);
  --shadow-md: 0 2px 8px -2px rgb(0 0 0 / 0.06), 0 1px 4px -2px rgb(0 0 0 / 0.04);
  --shadow-lg: 0 12px 24px -8px rgb(0 0 0 / 0.08), 0 4px 12px -4px rgb(0 0 0 / 0.05);
  --shadow-xl: 0 20px 40px -12px rgb(0 0 0 / 0.10);

  /* ===== 字体 ===== */
  --font-sans: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;

  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* ===== 间距 ===== */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-success: var(--state-success);
  --color-warning: var(--state-warning);
  --color-error: var(--state-error);
  --color-info: var(--state-info);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --radius-xl: var(--radius-xl);
  --radius-full: var(--radius-full);
}

/* ===== 基础样式 ===== */
* {
  box-sizing: border-box;
  border-color: var(--border);
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== 工具类 ===== */
.text-muted { color: var(--muted-foreground); }
.text-success { color: var(--state-success); }
.text-warning { color: var(--state-warning); }
.text-error { color: var(--state-error); }

.bg-success { background: var(--state-success-bg); }
.bg-warning { background: var(--state-warning-bg); }
.bg-error { background: var(--state-error-bg); }
.bg-info { background: var(--state-info-bg); }

.border-success { border-color: var(--state-success-border); }
.border-warning { border-color: var(--state-warning-border); }
.border-error { border-color: var(--state-error-border); }

    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* ===== Page-specific: Step 2 Config Default ===== */

      /* Switch Component */
      .switch-track {
        width: 36px;
        height: 20px;
      }
      .switch-thumb {
        width: 16px;
        height: 16px;
        top: 2px;
        left: 2px;
      }
      .switch-off .switch-track {
        background-color: var(--gray-200);
      }
      .switch-on .switch-track {
        background-color: var(--primary-600);
      }
      .switch-on .switch-thumb {
        transform: translateX(16px);
      }

      /* Field row hover enhancement */
      .field-row:hover .eye-icon {
        color: var(--primary-600);
      }

      /* Step completed style */
      .step-completed {
        background-color: oklch(0.970 0.032 158);
        color: oklch(0.577 0.200 158);
      }
      .step-completed:hover {
        background-color: oklch(0.936 0.064 158);
      }

      /* Max content width constraint */
      .max-w-6xl {
        max-width: 1152px;
      }

      /* Badge outline variant */

        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted-foreground);
      }

        background: var(--muted);

<body class="min-h-screen font-sans antialiased bg-background text-foreground">
    <!-- ===== Header ===== -->
    <header class="h-16 bg-white border-b border-border sticky top-0 z-50">
      <div class="max-w-6xl mx-auto h-full px-6 flex items-center">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-md bg-primary/10 flex items-center justify-center text-primary">
            <i data-lucide="clipboard-list" class="w-5 h-5"></i>
          </div>
          <h1 class="text-lg font-semibold text-foreground">AI生成测试用例</h1>
        </div>
      </div>
    </header>

    <!-- ===== Step Navigation ===== -->
    <section class="py-8 bg-background">
      <div class="max-w-6xl mx-auto px-6">
        <div class="flex items-center justify-center">
          <!-- Step 1 - Completed -->
          <button data-dom-id="step-nav-1" class="step-item step-completed flex items-center gap-2 px-4 py-2 rounded-full bg-success/10 text-success hover:bg-success/20 transition-colors cursor-pointer">
            <span class="w-5 h-5 rounded-full bg-success flex items-center justify-center">
              <i data-lucide="check" class="w-3 h-3 text-white"></i>
            </span>
            <span class="text-sm font-medium">上传文档</span>
          </button>

          <!-- Connector 1-2 -->
          <div class="w-12 h-px bg-border mx-1"></div>

          <!-- Step 2 - Active -->
          <button data-dom-id="step-nav-2" class="step-item step-active flex items-center gap-2 px-4 py-2 rounded-full bg-primary text-primary-foreground cursor-default">
            <span class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-xs font-medium">2</span>
            <span class="text-sm font-medium">生成配置</span>
          </button>

          <!-- Connector 2-3 -->
          <div class="w-12 h-px bg-border mx-1"></div>

          <!-- Step 3 - Locked -->
          <button data-dom-id="step-nav-3" class="step-item step-locked flex items-center gap-2 px-4 py-2 rounded-full bg-muted/40 text-muted-foreground cursor-not-allowed">
            <span class="w-5 h-5 rounded-full bg-border/60 flex items-center justify-center">
              <i data-lucide="lock" class="w-3 h-3"></i>
            </span>
            <span class="text-sm font-medium">生成结果</span>
          </button>

          <!-- Connector 3-4 -->
          <div class="w-12 h-px bg-border mx-1"></div>

          <!-- Step 4 - Locked -->
          <button data-dom-id="step-nav-4" class="step-item step-locked flex items-center gap-2 px-4 py-2 rounded-full bg-muted/40 text-muted-foreground cursor-not-allowed">
            <span class="w-5 h-5 rounded-full bg-border/60 flex items-center justify-center">
              <i data-lucide="lock" class="w-3 h-3"></i>
            </span>
            <span class="text-sm font-medium">预览导出</span>
          </button>
        </div>
      </div>
    </section>

    <!-- ===== Main Content ===== -->
    <main class="pb-16">
      <div class="max-w-6xl mx-auto px-6 space-y-6">

        <!-- Card 1: Trace Feature -->
        <div class="bg-card border border-border rounded-lg shadow-sm">
          <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-sm font-medium text-foreground">追溯功能</span>
              <button class="w-4 h-4 text-muted-foreground hover:text-foreground transition-colors" title="开启后将为每条用例生成追溯信息，关联原始需求文档位置">
                <i data-lucide="help-circle" class="w-4 h-4"></i>
              </button>
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium border border-border text-muted-foreground">
                默认关闭
              </span>
            </div>
            <label class="switch switch-off cursor-pointer">
              <input type="checkbox" class="sr-only">
              <span class="switch-track relative inline-block w-9 h-5 rounded-full bg-gray-200 transition-colors">
                <span class="switch-thumb absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow-sm transition-transform"></span>
              </span>
            </label>
          </div>
        </div>

        <!-- Card 2: Field Configuration -->
        <div class="bg-card border border-border rounded-lg shadow-sm overflow-hidden">
          <!-- Card Header -->
          <div class="px-6 py-5 border-b border-border">
            <div class="flex items-start justify-between">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <h2 class="text-base font-semibold text-card-foreground">字段配置</h2>
                  <button class="w-4 h-4 text-muted-foreground hover:text-foreground transition-colors" title="配置生成测试用例时包含的字段">
                    <i data-lucide="help-circle" class="w-4 h-4"></i>
                  </button>
                </div>
                <p class="text-sm text-muted-foreground">内置字段：15 个；当前可见 15 个</p>
              </div>
              <button class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">
                <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
                <span>排序</span>
              </button>
            </div>
          </div>

          <!-- Card Content -->
          <div class="px-6 py-5">
            <!-- Field Grid -->
            <div class="grid grid-cols-3 gap-3 mb-6">
              <!-- Field 1: 用例 ID -->
              <div class="field-row flex items-center gap-2 px-3 py-2 border border-border rounded-md hover:bg-gray-50 cursor-pointer transition-colors">
                <i data-lucide="eye" class="w-4 h-4 text-foreground flex-shrink-0"></i>
                <span class="text-sm font-normal text-foreground">用例 ID</span>
              </div>
              <!-- Field 2: 模块 -->
              <div class="field-row flex items-center gap-2 px-3 py-2 border border-border rounded-md hover:bg-gray-50 cursor-pointer transition-colors">
                <i data-lucide="eye" class="w-4 h-4 text-foreground flex-shrink-0"></i>
                <span class="text-sm font-normal text-foreground">模块</span>
              </div>
              <!-- Field 3: 标题 -->
              <div class="field-row flex items-center gap-2 px-3 py-2 border border-border rounded-md hover:bg-gray-50 cursor-pointer transition-colors">
                <i data-lucide="eye" class="w-4 h-4 text-foreground flex-shrink-0"></i>
                <span class="text-sm font-normal text-foreground">标题</span>
              </div>
              <!-- Field 4: 测试类型 -->
              <div class="field-row flex items-center gap-2 px-3 py-2 border border-border rounded-md hover:bg-gray-50 cursor-pointer transition-colors">
                <i data-lucide="eye" class="w-4 h-4 text-foreground flex-shrink-0"></i>
                <span class="text-sm font-normal text-foreground">测试类型</span>
              </div>
              <!-- Field 5: 优先级 -->
              <div class="field-row flex items-center gap-2 px-3 py-2 border border-border rounded-md hover:bg-gray-50 cursor-pointer transition-colors">
                <i data-lucide="eye" class="w-4 h-4 text-foreground flex-shrink-0"></i>
                <span class="text-sm font-normal text-foreground">优先级</span>
              </div>
              <!-- Field 6: 前置条件 -->
              <div class="field-row flex items-center gap-2 px-3 py-2 border border-border rounded-md hover:bg-gray-50 cursor-pointer transition-colors">
                <i data-lucide="eye" class="w-4 h-4 text-foreground flex-shrink-0"></i>
                <span class="text-sm font-normal text-foreground">前置条件</span>
              </div>
              <!-- Field 7: 测试数据 -->
              <div class="field-row flex items-center gap-2 px-3 py-2 border border-border rounded-md hover:bg-gray-50 cursor-pointer transition-colors">
                <i data-lucide="eye" class="w-4 h-4 text-foreground flex-shrink-0"></i>
                <span class="text-sm font-normal text-foreground">测试数据</span>
              </div>
              <!-- Field 8: 操作步骤 -->
              <div class="field-row flex items-center gap-2 px-3 py-2 border border-border rounded-md hover:bg-gray-50 cursor-pointer transition-colors">
                <i data-lucide="eye" class="w-4 h-4 text-foreground flex-shrink-0"></i>
                <span class="text-sm font-normal text-foreground">操作步骤</span>
              </div>
              <!-- Field 9: 预期结果 -->
              <div class="field-row flex items-center gap-2 px-3 py-2 border border-border rounded-md hover:bg-gray-50 cursor-pointer transition-colors">
                <i data-lucide="eye" class="w-4 h-4 text-foreground flex-shrink-0"></i>
                <span class="text-sm font-normal text-foreground">预期结果</span>
              </div>
            </div>

            <!-- Custom Field Section -->
            <div class="pt-4 border-t border-border">
              <label class="block text-sm font-medium text-foreground mb-2">新增自定义字段</label>
              <div class="flex gap-2">
                <input type="text" placeholder="例如：所属迭代、关联需求单号" class="flex-1 h-9 px-3 rounded-md border border-border bg-white text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                <button class="inline-flex items-center justify-center h-9 px-4 rounded-md bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 transition-opacity">
                  添加
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 3: Model Configuration -->
        <div class="bg-card border border-border rounded-lg shadow-sm overflow-hidden">
          <!-- Card Header -->
          <div class="px-6 py-5 border-b border-border">
            <div class="flex items-center gap-2">
              <h2 class="text-base font-semibold text-card-foreground">模型配置</h2>
              <button class="w-4 h-4 text-muted-foreground hover:text-foreground transition-colors" title="选择用于生成测试用例的 AI 模型">
                <i data-lucide="help-circle" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Card Content -->
          <div class="px-6 py-5">
            <div class="flex items-center gap-2 mb-2">
              <label class="text-sm font-medium text-foreground">选择模型</label>
              <button class="w-4 h-4 text-muted-foreground hover:text-foreground transition-colors" title="刷新模型列表">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
              </button>
              <button class="w-4 h-4 text-muted-foreground hover:text-foreground transition-colors" title="不同模型在生成质量、速度和成本上有所差异">
                <i data-lucide="help-circle" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- Select/Dropdown Trigger -->
            <button class="w-full h-10 px-3 rounded-md border border-border bg-white flex items-center justify-between hover:border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
              <span class="text-sm text-foreground">openai/gpt-5.6-luna</span>
              <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground"></i>
            </button>

            <!-- Selected Model Details -->
            <div class="mt-4 p-4 rounded-md bg-muted/30 border border-border">
              <div class="flex items-start justify-between mb-2">
                <div>
                  <p class="text-sm font-medium text-foreground">GPT-5.6 Luna</p>
                  <p class="text-xs text-muted-foreground font-mono mt-0.5">openai/gpt-5.6-luna</p>
                </div>
                <div class="flex gap-1.5">
                  <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-muted text-muted-foreground">
                    图片
                  </span>
                  <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium border border-border text-muted-foreground">
                    结构化
                  </span>
                </div>
              </div>
              <p class="text-xs text-muted-foreground">输入 $1.25 / 输出 $5.00 / 百万 tokens</p>
            </div>
          </div>

          <!-- Card Footer -->
          <div class="px-6 py-4 border-t border-border bg-muted/20">
            <div class="flex items-center justify-between">
              <button data-dom-id="btn-prev-step2" class="inline-flex items-center gap-2 h-9 px-4 rounded-md border border-border bg-transparent text-foreground text-sm font-medium hover:bg-gray-50 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>上一步：上传文档</span>
              </button>
              <button data-dom-id="btn-next-step2" class="inline-flex items-center gap-2 h-9 px-4 rounded-md bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 transition-opacity">
                <span>下一步：生成</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>

      </div>
    </main>

    <script>
      lucide.createIcons();
    </script>
</body>
</html>
