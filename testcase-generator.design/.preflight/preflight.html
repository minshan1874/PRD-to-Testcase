<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* ============================================================
   TestCase Generator — Design Tokens
   Modern Minimal · Indigo Primary · Tool-first
   ============================================================ */

:root {
  /* --- Brand Primary (Indigo) --- */
  --tc-primary: #4F46E5;
  --tc-primary-foreground: #FFFFFF;
  --tc-primary-hover: #4338CA;
  --tc-primary-active: #3730A3;
  --tc-primary-50: #EEF2FF;
  --tc-primary-100: #E0E7FF;
  --tc-primary-200: #C7D2FE;

  /* --- Background & Surfaces --- */
  --tc-background: #FAFAFB;
  --tc-foreground: #0F172A;
  --tc-card: #FFFFFF;
  --tc-card-foreground: #0F172A;
  --tc-popover: #FFFFFF;
  --tc-popover-foreground: #0F172A;

  /* --- Muted / Secondary Text --- */
  --tc-muted: #F1F5F9;
  --tc-muted-foreground: #64748B;
  --tc-foreground-secondary: #475569;
  --tc-foreground-tertiary: #94A3B8;

  /* --- Border & Input --- */
  --tc-border: #E2E8F0;
  --tc-input: #E2E8F0;
  --tc-ring: #4F46E5;

  /* --- Accent / Surface-2 --- */
  --tc-accent: #F1F5F9;
  --tc-accent-foreground: #0F172A;
  --tc-surface-2: #F8FAFC;

  /* --- State Colors --- */
  --tc-success: #10B981;
  --tc-success-foreground: #FFFFFF;
  --tc-success-bg: #ECFDF5;
  --tc-warning: #F59E0B;
  --tc-warning-foreground: #FFFFFF;
  --tc-warning-bg: #FFFBEB;
  --tc-error: #EF4444;
  --tc-error-foreground: #FFFFFF;
  --tc-error-bg: #FEF2F2;
  --tc-info: #3B82F6;
  --tc-info-bg: #EFF6FF;

  /* --- Radius Scale --- */
  --tc-radius-sm: 6px;
  --tc-radius-md: 8px;
  --tc-radius-lg: 12px;
  --tc-radius-xl: 16px;
  --tc-radius-pill: 999px;

  /* --- Shadow Scale --- */
  --tc-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.03);
  --tc-shadow-md: 0 4px 12px -4px rgba(15, 23, 42, 0.10);
  --tc-shadow-lg: 0 12px 32px -8px rgba(15, 23, 42, 0.18);

  /* --- Spacing (8pt grid) --- */
  --tc-s-1: 4px;
  --tc-s-2: 8px;
  --tc-s-3: 12px;
  --tc-s-4: 16px;
  --tc-s-5: 24px;
  --tc-s-6: 32px;
  --tc-s-7: 48px;
  --tc-s-8: 64px;

  /* --- Typography --- */
  --tc-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --tc-font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, monospace;

  --tc-text-xs: 12px;
  --tc-text-sm: 13px;
  --tc-text-base: 14px;
  --tc-text-lg: 16px;
  --tc-text-xl: 18px;
  --tc-text-2xl: 20px;
  --tc-text-3xl: 24px;
  --tc-text-4xl: 30px;
  --tc-text-display: clamp(28px, 3.5vw, 44px);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--tc-background);
    --color-foreground: var(--tc-foreground);
    --color-card: var(--tc-card);
    --color-card-foreground: var(--tc-card-foreground);
    --color-popover: var(--tc-popover);
    --color-popover-foreground: var(--tc-popover-foreground);
    --color-primary: var(--tc-primary);
    --color-primary-foreground: var(--tc-primary-foreground);
    --color-muted: var(--tc-muted);
    --color-muted-foreground: var(--tc-muted-foreground);
    --color-accent: var(--tc-accent);
    --color-accent-foreground: var(--tc-accent-foreground);
    --color-border: var(--tc-border);
    --color-input: var(--tc-input);
    --color-ring: var(--tc-ring);
    --radius-sm: var(--tc-radius-sm);
    --radius-md: var(--tc-radius-md);
    --radius-lg: var(--tc-radius-lg);
    --radius-xl: var(--tc-radius-xl);
  }
  @layer base {
    body { background: var(--tc-background); color: var(--tc-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
