/* ============================================================
   TestCase Generator — Dark Tech Theme
   Indigo Neon · Glassmorphism · Tech Grid
   ============================================================ */

:root {
  /* --- Brand Primary (Indigo Neon) --- */
  --tc-primary: #6366F1;
  --tc-primary-foreground: #FFFFFF;
  --tc-primary-hover: #818CF8;
  --tc-primary-active: #4F46E5;
  --tc-primary-glow: rgba(99, 102, 241, 0.6);
  --tc-primary-50: rgba(99, 102, 241, 0.1);
  --tc-primary-100: rgba(99, 102, 241, 0.2);
  --tc-primary-200: rgba(99, 102, 241, 0.35);

  /* --- Background & Surfaces --- */
  --tc-background: #0A0E1A;
  --tc-background-2: #0F172A;
  --tc-foreground: #E2E8F0;
  --tc-card: rgba(15, 23, 42, 0.6);
  --tc-card-2: rgba(30, 41, 59, 0.4);
  --tc-card-foreground: #E2E8F0;
  --tc-popover: rgba(15, 23, 42, 0.95);
  --tc-popover-foreground: #E2E8F0;

  /* --- Muted / Secondary Text --- */
  --tc-muted: rgba(148, 163, 184, 0.1);
  --tc-muted-foreground: #94A3B8;
  --tc-foreground-secondary: #CBD5E1;
  --tc-foreground-tertiary: #64748B;

  /* --- Border & Input --- */
  --tc-border: rgba(148, 163, 184, 0.15);
  --tc-border-glow: rgba(99, 102, 241, 0.4);
  --tc-input: rgba(15, 23, 42, 0.8);
  --tc-ring: #6366F1;

  /* --- Accent / Surface-2 --- */
  --tc-accent: rgba(148, 163, 184, 0.08);
  --tc-accent-foreground: #E2E8F0;
  --tc-surface-2: rgba(30, 41, 59, 0.5);

  /* --- State Colors --- */
  --tc-success: #10B981;
  --tc-success-foreground: #FFFFFF;
  --tc-success-bg: rgba(16, 185, 129, 0.15);
  --tc-warning: #F59E0B;
  --tc-warning-foreground: #FFFFFF;
  --tc-warning-bg: rgba(245, 158, 11, 0.15);
  --tc-error: #EF4444;
  --tc-error-foreground: #FFFFFF;
  --tc-error-bg: rgba(239, 68, 68, 0.15);
  --tc-info: #3B82F6;
  --tc-info-bg: rgba(59, 130, 246, 0.15);

  /* --- Radius Scale --- */
  --tc-radius-sm: 6px;
  --tc-radius-md: 10px;
  --tc-radius-lg: 14px;
  --tc-radius-xl: 18px;
  --tc-radius-pill: 999px;

  /* --- Shadow Scale (soft, dark-adapted) --- */
  --tc-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --tc-shadow-md: 0 4px 12px -4px rgba(0, 0, 0, 0.4);
  --tc-shadow-lg: 0 12px 32px -8px rgba(0, 0, 0, 0.5);

  /* --- Spacing (8pt grid) --- */
  --tc-s-1: 4px;
  --tc-s-2: 8px;
  --tc-s-3: 12px;
  --tc-s-4: 16px;
  --tc-s-5: 24px;
  --tc-s-6: 32px;
  --tc-s-7: 48px;
  --tc-s-8: 64px;

  /* --- Typography --- */
  --tc-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --tc-font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, monospace;

  --tc-text-xs: 12px;
  --tc-text-sm: 13px;
  --tc-text-base: 14px;
  --tc-text-lg: 16px;
  --tc-text-xl: 18px;
  --tc-text-2xl: 20px;
  --tc-text-3xl: 24px;
  --tc-text-4xl: 30px;
  --tc-text-display: clamp(28px, 3.5vw, 44px);
}

    </style>

      /* ========== Dark Tech Theme — Background ========== */
      .tc-dark-bg {
        background: var(--tc-background);
        position: relative;
        overflow: hidden;
      }
      .tc-dark-bg::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image:
          linear-gradient(rgba(99, 102, 241, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(99, 102, 241, 0.04) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }
      .tc-dark-bg::after {
        content: '';
        position: fixed;
        top: -30%;
        left: 50%;
        transform: translateX(-50%);
        width: 1200px;
        height: 800px;
        background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0.05) 30%, transparent 70%);
        pointer-events: none;
        z-index: 0;
      }
      .tc-content-layer {
        position: relative;
        z-index: 1;
      }

      /* ========== Glassmorphism Card ========== */
      .tc-glass-card {
        background: var(--tc-card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--tc-border);
        border-radius: var(--tc-radius-lg);
        box-shadow: var(--tc-shadow-lg);
        position: relative;
        overflow: hidden;
      }
      .tc-glass-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.3), transparent);
      }

      /* ========== Top Navigation ========== */
      .tc-top-nav {
        background: rgba(10, 14, 26, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--tc-border);
        position: sticky;
        top: 0;
        z-index: 50;
      }
      .tc-nav-item-dark {
        position: relative;
        padding: 8px 16px;
        border-radius: var(--tc-radius-md);
        font-size: var(--tc-text-sm);
        color: var(--tc-muted-foreground);
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .tc-nav-item-dark:hover {
        color: var(--tc-foreground);
        background: rgba(99, 102, 241, 0.08);
      }
      .tc-nav-item-dark.active {
        color: var(--tc-primary);
        background: rgba(99, 102, 241, 0.12);
        font-weight: 500;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
      }
      .tc-nav-item-dark.active::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 50%;
        transform: translateX(-50%);
        width: 24px;
        height: 2px;
        background: var(--tc-primary);
        border-radius: 2px;
        box-shadow: 0 0 8px var(--tc-primary-glow);
      }

      /* ========== Disabled Section ========== */
      .tc-section-disabled {
        opacity: 0.6;
        pointer-events: none;
        user-select: none;
        filter: saturate(0.5);
      }

      /* ========== Analyzing Badge ========== */
      .tc-analyzing-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: var(--tc-radius-pill);
        font-size: var(--tc-text-xs);
        font-weight: 500;
        background: rgba(99, 102, 241, 0.15);
        color: var(--tc-primary);
        border: 1px solid rgba(99, 102, 241, 0.3);
        animation: pulse-glow 2s ease-in-out infinite;
      }
      .tc-analyzing-badge .tc-badge-icon {
        animation: spin 1s linear infinite;
      }

      /* ========== Input (Dark) ========== */
      .tc-input-dark {
        background: var(--tc-input);
        border: 1px solid var(--tc-border);
        border-radius: var(--tc-radius-md);
        color: var(--tc-foreground);
        transition: all 0.2s ease;
      }
      .tc-input-dark:focus {
        outline: none;
        border-color: var(--tc-primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15), 0 0 20px rgba(99, 102, 241, 0.1);
      }
      .tc-input-dark:disabled,
      .tc-input-dark[readonly] {
        cursor: not-allowed;
        opacity: 0.7;
      }

      /* ========== Type Tags (Dark) ========== */
      .tc-type-tag-dark {
        padding: 6px 14px;
        border: 1px solid var(--tc-border);
        border-radius: var(--tc-radius-md);
        font-size: var(--tc-text-sm);
        color: var(--tc-muted-foreground);
        cursor: pointer;
        transition: all 0.2s ease;
        background: rgba(15, 23, 42, 0.5);
      }
      .tc-type-tag-dark:hover {
        border-color: var(--tc-primary-200);
        color: var(--tc-foreground);
      }
      .tc-type-tag-dark.active {
        background: rgba(99, 102, 241, 0.15);
        border-color: var(--tc-primary);
        color: var(--tc-primary);
        font-weight: 500;
      }

      /* ========== Section Titles ========== */
      .tc-section-title-dark {
        font-size: var(--tc-text-lg);
        font-weight: 600;
        color: var(--tc-foreground);
        letter-spacing: 0.01em;
      }
      .tc-section-desc-dark {
        font-size: var(--tc-text-sm);
        color: var(--tc-muted-foreground);
      }
      .tc-label-dark {
        font-size: var(--tc-text-sm);
        font-weight: 500;
        color: var(--tc-foreground-secondary);
      }

      /* ========== Loading Button ========== */
      .tc-btn-loading-dark {
        position: relative;
        background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #6366F1 100%);
        background-size: 200% 200%;
        color: var(--tc-primary-foreground);
        border: none;
        border-radius: var(--tc-radius-md);
        font-weight: 600;
        cursor: not-allowed;
        overflow: visible;
        animation: flow-gradient 3s linear infinite, breath 3s ease-in-out infinite;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4), 0 4px 12px rgba(99, 102, 241, 0.3);
      }
      .tc-btn-loading-dark::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%);
        border-radius: var(--tc-radius-md);
        background: transparent;
        border: 2px solid rgba(99, 102, 241, 0.5);
        animation: ripple 2s ease-out infinite;
        pointer-events: none;
      }
      .tc-btn-loading-dark::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%);
        border-radius: var(--tc-radius-md);
        background: transparent;
        border: 2px solid rgba(99, 102, 241, 0.3);
        animation: ripple 2s ease-out infinite;
        animation-delay: 0.8s;
        pointer-events: none;
      }

      /* ========== Spinner (Glow) ========== */
      .tc-spinner-dark {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6));
      }

      /* ========== Progress Card ========== */
      .tc-progress-card {
        position: relative;
        background: var(--tc-card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--tc-border);
        border-radius: var(--tc-radius-lg);
        overflow: hidden;
      }
      .tc-progress-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--tc-primary), #22D3EE, var(--tc-primary));
        background-size: 200% 100%;
        animation: flow-gradient 3s linear infinite;
      }
      .tc-progress-percent {
        font-family: var(--tc-font-mono);
        font-size: 56px;
        font-weight: 700;
        text-align: center;
        background: linear-gradient(135deg, #6366F1 0%, #22D3EE 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.5));
        letter-spacing: -0.02em;
      }

      /* ========== Progress Bar (Gradient Flow) ========== */
      .tc-progress-track-dark {
        height: 8px;
        background: rgba(148, 163, 184, 0.1);
        border-radius: var(--tc-radius-pill);
        overflow: hidden;
        position: relative;
      }
      .tc-progress-fill-dark {
        height: 100%;
        background: linear-gradient(90deg, var(--tc-primary), #22D3EE);
        background-size: 200% 100%;
        border-radius: var(--tc-radius-pill);
        position: relative;
        animation: flow-gradient 3s linear infinite;
      }
      .tc-progress-fill-dark::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 40px;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
        animation: shimmer 1.5s ease-in-out infinite;
      }

      /* ========== Step Indicators (Vertical) ========== */
      .tc-steps-vertical {
        position: relative;
        padding-left: 12px;
      }
      .tc-step-row {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 10px 0;
      }
      .tc-step-row:not(:last-child)::before {
        content: '';
        position: absolute;
        left: 9px;
        top: 34px;
        bottom: -10px;
        width: 2px;
        background: var(--tc-border);
      }
      .tc-step-row.done:not(:last-child)::before {
        background: linear-gradient(180deg, var(--tc-success), rgba(16, 185, 129, 0.3));
      }
      .tc-step-dot-dark {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        z-index: 1;
        margin-top: 1px;
      }
      .tc-step-dot-dark.done {
        background: var(--tc-success);
        color: var(--tc-success-foreground);
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
      }
      .tc-step-dot-dark.active {
        background: var(--tc-primary);
        color: var(--tc-primary-foreground);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2), 0 0 16px rgba(99, 102, 241, 0.5);
        animation: pulse-glow 2s ease-in-out infinite;
      }
      .tc-step-dot-dark.pending {
        background: transparent;
        border: 2px solid var(--tc-border);
      }
      .tc-step-text-dark {
        font-size: var(--tc-text-sm);
        color: var(--tc-foreground-tertiary);
      }
      .tc-step-text-dark.done {
        color: var(--tc-success);
        font-weight: 500;
      }
      .tc-step-text-dark.active {
        color: var(--tc-primary);
        font-weight: 500;
      }
      .tc-step-sub-text {
        font-size: var(--tc-text-xs);
        color: var(--tc-muted-foreground);
        margin-top: 2px;
        font-family: var(--tc-font-mono);
      }

      /* ========== Skeleton Cards ========== */
      .tc-skeleton-card {
        background: var(--tc-card-2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--tc-border);
        border-radius: var(--tc-radius-md);
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      .tc-skeleton-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.08), transparent);
        animation: shimmer 1.5s linear infinite;
      }
      .tc-skeleton-line {
        height: 12px;
        background: rgba(148, 163, 184, 0.1);
        border-radius: 4px;
        margin-bottom: 10px;
      }
      .tc-skeleton-line.short {
        width: 40%;
      }
      .tc-skeleton-line.medium {
        width: 70%;
      }
      .tc-skeleton-line.long {
        width: 90%;
      }

      /* ========== Tabs (Dark) ========== */
      .tc-tab-dark {
        padding: 8px 16px;
        font-size: var(--tc-text-sm);
        color: var(--tc-muted-foreground);
        border-bottom: 2px solid transparent;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .tc-tab-dark:hover {
        color: var(--tc-foreground);
      }
      .tc-tab-dark.active {
        color: var(--tc-primary);
        border-bottom-color: var(--tc-primary);
        font-weight: 500;
      }

      /* ========== Icon Button (Dark) ========== */
      .tc-icon-btn-dark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: var(--tc-radius-md);
        color: var(--tc-muted-foreground);
        transition: all 0.15s ease;
        cursor: pointer;
      }
      .tc-icon-btn-dark:hover {
        background: rgba(99, 102, 241, 0.1);
        color: var(--tc-foreground);
      }

      /* ========== Priority Tags (Dark) ========== */
      .tc-tag-dark {
        display: inline-flex;
        align-items: center;
        padding: 2px 10px;
        border-radius: var(--tc-radius-pill);
        font-size: var(--tc-text-xs);
        font-weight: 500;
        line-height: 1.6;
      }
      .tc-priority-high-dark {
        background: rgba(239, 68, 68, 0.15);
        color: #F87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
      .tc-priority-medium-dark {
        background: rgba(245, 158, 11, 0.15);
        color: #FBBF24;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }
      .tc-priority-low-dark {
        background: rgba(59, 130, 246, 0.15);
        color: #60A5FA;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }

      /* ========== Mono ========== */
      .tc-mono {
        font-family: var(--tc-font-mono);
      }

      /* ========== Switch (Dark) ========== */
      .tc-switch-dark {
        width: 36px;
        height: 20px;
        border-radius: 999px;
        position: relative;
        flex-shrink: 0;
      }
      .tc-switch-dark.on {
        background: var(--tc-primary);
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
      }
      .tc-switch-dark.off {
        background: var(--tc-border);
      }
      .tc-switch-knob {
        position: absolute;
        top: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: all 0.2s ease;
      }
      .tc-switch-dark.on .tc-switch-knob {
        right: 2px;
      }
      .tc-switch-dark.off .tc-switch-knob {
        left: 2px;
      }

      /* ========== Animations ========== */
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulse-glow {
        0%, 100% {
          box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
        }
        50% {
          box-shadow: 0 0 24px rgba(99, 102, 241, 0.6);
        }
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(200%);
        }
      }

      @keyframes flow-gradient {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 200% 50%;
        }
      }

      @keyframes ripple {
        0% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.6;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.4);
          opacity: 0;
        }
      }

      @keyframes breath {
        0%, 100% {
          box-shadow: 0 0 20px rgba(99, 102, 241, 0.4), 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        50% {
          box-shadow: 0 0 32px rgba(99, 102, 241, 0.6), 0 4px 16px rgba(99, 102, 241, 0.4);
        }
      }

      /* ========== Reduced Motion Fallback ========== */
      @media (prefers-reduced-motion: reduce) {
        .tc-analyzing-badge { animation: none; }
        .tc-analyzing-badge .tc-badge-icon { animation: none; }
        .tc-btn-loading-dark {
          animation: none;
          background-size: 100% 100%;
        }
        .tc-btn-loading-dark::before,
        .tc-btn-loading-dark::after {
          animation: none;
          opacity: 0;
        }
        .tc-spinner-dark { animation: none; }
        .tc-progress-card::before { animation: none; }
        .tc-progress-fill-dark { animation: none; background-size: 100% 100%; }
        .tc-progress-fill-dark::after { animation: none; opacity: 0.6; }
        .tc-step-dot-dark.active { animation: none; }
        .tc-skeleton-card::after { animation: none; opacity: 0.3; }
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased tc-dark-bg" style="font-family: var(--tc-font-sans);">

<div class="tc-content-layer">

<!-- ===== Top Navigation ===== -->

</header>

<!-- ===== Main Workspace ===== -->
<main class="max-w-[1600px] mx-auto px-6 py-6">

例如：用户登录功能，支持手机号+密码登录、短信验证码登录、第三方微信登录。登录失败时显示错误提示，连续5次失败锁定账户15分钟。"></textarea>

        <!-- Test Type Tags -->

        </div>

        <!-- Priority Distribution -->

        </div>

        <!-- Advanced Options -->
        <div class="border-t pt-4" style="border-color: var(--tc-border);">
          <button class="flex items-center justify-between w-full text-left">
            <span class="tc-label-dark">高级选项</span>
            <i data-lucide="chevron-down" class="w-4 h-4" style="color: var(--tc-muted-foreground);"></i>
          </button>
          <div class="mt-4 space-y-3">
            <label class="flex items-center gap-3">
              <div class="tc-switch-dark on">
                <div class="tc-switch-knob"></div>
              </div>
              <span class="text-sm" style="color: var(--tc-foreground-secondary);">包含负面用例</span>

            <label class="flex items-center gap-3">

</main>
