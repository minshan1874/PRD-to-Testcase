   TestCase Generator — Glassmorphism Luxury Theme
   Lavender Purple · Rose Gold Accent · Soft Glass

:root {

  --tc-primary: #8B5CF6;

  --tc-primary-hover: #7C3AED;

  --tc-background: #FAF7FF;
  --tc-foreground: #1E1B4B;
  --tc-card: rgba(255, 255, 255, 0.55);
  --tc-card-foreground: #1E1B4B;
  --tc-popover: rgba(255, 255, 255, 0.85);

  --tc-glass-border: rgba(255, 255, 255, 0.85);
  --tc-glass-border-soft: rgba(255, 255, 255, 0.5);
  --tc-glass-blur: 20px;
  --tc-glass-saturate: 180%;

  /* --- Muted / Secondary Text --- */
  --tc-muted: #F5F3FF;
  --tc-muted-foreground: #7C7A9B;
  --tc-foreground-secondary: #4C4A6B;
  --tc-foreground-tertiary: #A8A6C0;

  /* --- Border & Input --- */
  --tc-border: #E8E4F5;
  --tc-input: rgba(255, 255, 255, 0.72);
  --tc-ring: #8B5CF6;

  /* --- Accent / Surface-2 --- */
  --tc-accent: #F5F3FF;
  --tc-accent-foreground: #1E1B4B;
  --tc-surface-2: rgba(245, 243, 255, 0.6);

  /* --- State Colors --- */
  --tc-success: #10B981;
  --tc-success-foreground: #FFFFFF;
  --tc-success-bg: #ECFDF5;
  --tc-warning: #F59E0B;
  --tc-warning-foreground: #FFFFFF;
  --tc-warning-bg: #FFFBEB;
  --tc-error: #F43F5E;
  --tc-error-foreground: #FFFFFF;
  --tc-error-bg: #FFF1F2;
  --tc-info: #6366F1;
  --tc-info-bg: #EEF2FF;

  /* --- Radius Scale (larger, softer) --- */
  --tc-radius-sm: 8px;
  --tc-radius-md: 12px;
  --tc-radius-lg: 18px;
  --tc-radius-xl: 24px;
  --tc-radius-pill: 999px;

  /* --- Shadow Scale (purple-tinted, soft) --- */
  --tc-shadow-sm: 0 1px 2px rgba(30, 27, 75, 0.04), 0 1px 1px rgba(139, 92, 246, 0.03);
  --tc-shadow-md: 0 4px 12px -4px rgba(139, 92, 246, 0.10);
  --tc-shadow-lg: 0 12px 32px -8px rgba(139, 92, 246, 0.18);

  /* --- Spacing (8pt grid) --- */
  --tc-s-1: 4px;
  --tc-s-2: 8px;
  --tc-s-3: 12px;
  --tc-s-4: 16px;
  --tc-s-5: 24px;
  --tc-s-6: 32px;
  --tc-s-7: 48px;
  --tc-s-8: 64px;

  /* --- Typography --- */
  --tc-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --tc-font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, monospace;

  --tc-text-xs: 12px;
  --tc-text-sm: 13px;
  --tc-text-base: 14px;
  --tc-text-lg: 16px;
  --tc-text-xl: 18px;
  --tc-text-2xl: 20px;
  --tc-text-3xl: 24px;
  --tc-text-4xl: 30px;
  --tc-text-display: clamp(28px, 3.5vw, 44px);
}

      /* ============================================================
         Page-specific styles — Glass Loading State
         ============================================================ */

      html, body {
        font-family: var(--tc-font-sans);
        font-size: var(--tc-text-base);
        line-height: 1.6;
      }

      /* --- Ambient background glows --- */
      .ambient-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: var(--tc-background);
        overflow: hidden;
      }
      .ambient-bg::before,
      .ambient-bg::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.45;
        pointer-events: none;
      }
      .ambient-bg::before {
        width: 520px;
        height: 520px;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, transparent 70%);
        top: -120px;
        left: -80px;
      }
      .ambient-bg::after {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(196, 181, 253, 0.4) 0%, transparent 70%);
        bottom: -180px;
        right: -120px;
      }
      .ambient-glow-3 {
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(60px);
        top: 40%;
        left: 55%;
        opacity: 0.6;
        pointer-events: none;
      }

      /* --- Glass card base --- */
      .glass-card {
        background: var(--tc-glass-bg);
        backdrop-filter: blur(var(--tc-glass-blur)) saturate(var(--tc-glass-saturate));
        -webkit-backdrop-filter: blur(var(--tc-glass-blur)) saturate(var(--tc-glass-saturate));
        border: 1px solid var(--tc-glass-border);
        border-radius: var(--tc-radius-xl);
        box-shadow: var(--tc-shadow-lg);
      }
      .glass-card-strong {
        background: var(--tc-glass-bg-strong);
        backdrop-filter: blur(var(--tc-glass-blur)) saturate(var(--tc-glass-saturate));
        -webkit-backdrop-filter: blur(var(--tc-glass-blur)) saturate(var(--tc-glass-saturate));
        border: 1px solid var(--tc-glass-border);
        border-radius: var(--tc-radius-xl);
        box-shadow: var(--tc-shadow-lg);
      }

      /* --- Glass nav --- */
      .glass-nav {
        background: rgba(255, 255, 255, 0.45);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.6);
      }

      /* --- Disabled section opacity --- */
      .section-disabled {
        opacity: 0.7;
        pointer-events: none;
      }

      /* --- Gradient text --- */
      .gradient-text {
        background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 50%, #C4B5FD 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      /* --- Analyzing badge --- */
      .analyzing-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        background: rgba(139, 92, 246, 0.12);
        color: var(--tc-primary);
        border: 1px solid rgba(139, 92, 246, 0.3);
        border-radius: 999px;
        font-size: var(--tc-text-xs);
        font-weight: 500;
        animation: pulse-glow 2s ease-in-out infinite;
      }
      .analyzing-badge .spin-icon {
        animation: spin 1s linear infinite;
      }

      /* --- Generate button loading state --- */
      .btn-generate-loading {
        position: relative;
        background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
        color: #fff;
        border-radius: var(--tc-radius-md);
        padding: 14px 28px;
        font-weight: 600;
        font-size: var(--tc-text-lg);
        border: none;
        cursor: not-allowed;
        box-shadow: 0 8px 24px -4px rgba(139, 92, 246, 0.45);
        animation: breath 3s ease-in-out infinite;
        overflow: visible;
      }
      .btn-generate-loading::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: calc(var(--tc-radius-md) + 2px);
        background: linear-gradient(135deg, #8B5CF6, #C4B5FD, #8B5CF6);
        background-size: 200% 200%;
        z-index: -1;
        opacity: 0.6;
        animation: flow-gradient 3s linear infinite;
        filter: blur(8px);
      }
      .btn-ripple-wrap {
        position: relative;
        display: inline-block;
      }
      .btn-ripple-wrap::before,
      .btn-ripple-wrap::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: var(--tc-radius-md);
        border: 2px solid rgba(139, 92, 246, 0.5);
        opacity: 0;
        animation: ripple 2s ease-out infinite;
        pointer-events: none;
      }
      .btn-ripple-wrap::after {
        animation-delay: 1s;
      }

      /* --- Loading spinner --- */
      .loading-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      /* --- Progress bar --- */
      .progress-track {
        height: 10px;
        background: rgba(139, 92, 246, 0.1);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .progress-fill {
        height: 100%;
        width: 67%;
        background: linear-gradient(90deg, #8B5CF6, #A78BFA, #C4B5FD);
        background-size: 200% 100%;
        border-radius: 999px;
        position: relative;
        animation: flow-gradient 3s linear infinite;
      }
      .progress-fill::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 30px;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
        animation: shimmer 1.5s linear infinite;
      }

      /* --- Step indicator --- */
      .step-item {
        position: relative;
        padding-left: 36px;
      }
      .step-item::before {
        content: '';
        position: absolute;
        left: 9px;
        top: 28px;
        bottom: -16px;
        width: 2px;
        background: var(--tc-border);
      }
      .step-item:last-child::before {
        display: none;
      }
      .step-dot {
        position: absolute;
        left: 0;
        top: 4px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .step-dot.completed {
        background: var(--tc-success);
        color: #fff;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      }
      .step-dot.active {
        background: var(--tc-primary);
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
        animation: pulse-glow 2s ease-in-out infinite;
      }
      .step-dot.pending {
        background: transparent;
        border: 2px solid var(--tc-border);
      }
      .step-item.completed::before {
        background: linear-gradient(to bottom, var(--tc-success), var(--tc-success));
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
      }
      .step-item.active::before {
        background: linear-gradient(to bottom, var(--tc-primary), var(--tc-border));
      }

      /* --- Skeleton shimmer --- */
      .skeleton-card {
        background: var(--tc-glass-bg);
        backdrop-filter: blur(var(--tc-glass-blur));
        -webkit-backdrop-filter: blur(var(--tc-glass-blur));
        border: 1px solid var(--tc-glass-border-soft);
        border-radius: var(--tc-radius-lg);
        overflow: hidden;
        position: relative;
      }
      .skeleton-line {
        height: 12px;
        background: linear-gradient(90deg, rgba(221, 214, 254, 0.4) 0%, rgba(221, 214, 254, 0.8) 50%, rgba(221, 214, 254, 0.4) 100%);
        background-size: 200% 100%;
        border-radius: 6px;
        animation: shimmer 1.5s linear infinite;
      }
      .skeleton-line.short {
        width: 40%;
      }
      .skeleton-line.medium {
        width: 70%;
      }
      .skeleton-line.long {
        width: 100%;
      }
      .skeleton-badge {
        width: 60px;
        height: 20px;
        background: linear-gradient(90deg, rgba(221, 214, 254, 0.4) 0%, rgba(221, 214, 254, 0.8) 50%, rgba(221, 214, 254, 0.4) 100%);
        background-size: 200% 100%;
        border-radius: 999px;
        animation: shimmer 1.5s linear infinite;
      }
      .skeleton-tag {
        width: 48px;
        height: 20px;
        background: linear-gradient(90deg, rgba(221, 214, 254, 0.4) 0%, rgba(221, 214, 254, 0.8) 50%, rgba(221, 214, 254, 0.4) 100%);
        background-size: 200% 100%;
        border-radius: 6px;
        animation: shimmer 1.5s linear infinite;
      }

      /* --- Textarea disabled look --- */
      .textarea-disabled {
        background: rgba(255, 255, 255, 0.4);
        border: 1px solid var(--tc-glass-border-soft);
        color: var(--tc-foreground-secondary);
        resize: none;
      }

      /* --- Select disabled --- */
      .select-disabled {
        background: rgba(255, 255, 255, 0.4);
        border: 1px solid var(--tc-glass-border-soft);
        color: var(--tc-foreground-secondary);
        appearance: none;
        -webkit-appearance: none;
      }

      /* --- Mono font --- */
      .font-mono-tc {
        font-family: var(--tc-font-mono);
      }

      /* ============================================================
         Animation keyframes
         ============================================================ */

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulse-glow {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.35);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(139, 92, 246, 0);
        }
      }

      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      @keyframes flow-gradient {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }

      @keyframes ripple {
        0% {
          transform: scale(1);
          opacity: 0.5;
        }
        100% {
          transform: scale(1.25);
          opacity: 0;
        }
      }

      @keyframes breath {
        0%, 100% {
          box-shadow: 0 8px 24px -4px rgba(139, 92, 246, 0.45);
        }
        50% {
          box-shadow: 0 12px 32px -4px rgba(139, 92, 246, 0.65);
        }
      }

      /* --- Reduced motion fallback --- */
      @media (prefers-reduced-motion: reduce) {
        .analyzing-badge,
        .analyzing-badge .spin-icon,
        .btn-generate-loading,
        .btn-generate-loading::before,
        .btn-ripple-wrap::before,
        .btn-ripple-wrap::after,
        .loading-spinner,
        .progress-fill,
        .progress-fill::after,
        .step-dot.active,
        .skeleton-line,
        .skeleton-badge,
        .skeleton-tag {
          animation: none !important;
        }
        .progress-fill::after {
          display: none;
        }
        .btn-generate-loading::before {
          filter: none;
          opacity: 0.3;
        }
      }
    </style>
</head>

本模块负责用户身份认证，支持手机号+密码、手机号+验证码、第三方登录（微信/QQ）三种方式。
